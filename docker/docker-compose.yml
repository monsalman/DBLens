version: "3.8"

services:
  dblens:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dblens
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DBLENS_AUTH_PASSWORD=${DBLENS_AUTH_PASSWORD:-}
      - DBLENS_CONNECTIONS=${DBLENS_CONNECTIONS:-}
    volumes:
      - dblens_data:/data

volumes:
  dblens_data:
